[package]
name = "aero-app"
description = "Aero desktop application (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aero"
path = "src/main.rs"

[dependencies]
aero-core.workspace = true
# 全文索引（zvec）与增量索引管线；C 库 rpath 见 build.rs
aero-index.workspace = true
aero-embedding.workspace = true
# UI 底座（ADR 0001）。GPUI 本体经 `gpui_kit::*` 使用，组件库经 `gpui_kit::component`
gpui-kit.workspace = true
# 应用数据目录下的 state.toml（最近 vault、面板状态）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# 命令行（方案 13.1）。图形界面仍是无参数或直接给库路径时启动
clap = { version = "4", features = ["derive"] }
# 兼容旧日志；本地诊断使用结构化事件，后台写入和容量管理在 diagnostics 中。
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
libc = "0.2"
# 图片解码 / 缩放（渲染服务，方案 9.9）。特性集与 GPUI 已启用的一致，不额外引入编解码器
image = "0.25"
# SVG 光栅化进同一条位图管线。版本跟依赖树里已有的 resvg 对齐
resvg = "0.45.1"
# 本地时间：冲突副本文件名、daily 笔记（锁到已在依赖树里的版本）
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# vault 文件监听（macOS FSEvents；方案 12）。与 GPUI 用的是同一个版本
notify = "7"
# 数学公式渲染（RaTeX，方案 6.5）：解析 → 排版（带主题色）→ 位图。`ratex` 本体是占位包，不用它
ratex-parser = "0.1.14"
ratex-layout = "0.1.14"
ratex-types = "0.1.14"
# embed-fonts：内嵌 KaTeX 字体，运行时不依赖 font_dir，打进 .app 即可用
ratex-render = { version = "0.1.14", features = ["embed-fonts"] }
# Mermaid 排版使用宿主 GPUI 文本测量，光栅化复用上面的 resvg。
merman = { version = "=0.7.0", default-features = false, features = ["render"] }
merman-render = { version = "=0.7.0", default-features = false }
# 原生 PDF 页面渲染，无浏览器或外部进程。
hayro = "=0.7.1"
# 索引被图形界面锁住时，CLI 把全文索引复制到临时目录再打开，进程结束时删掉
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# GPUI 当前没有设置 macOS 应用图标的 API；复用它已依赖的 AppKit 绑定。
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSImage"] }
# NSData：内嵌图标；NSFileManager/NSURL/NSError/NSString：移到废纸篓（trash.rs）
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSFileManager", "NSURL", "NSError", "NSString"] }

[dev-dependencies]
# 无头 GPUI 测试（TestAppContext）：在测试里真正渲染编辑器并模拟按键
gpui-kit = { workspace = true, features = ["test-support"] }
